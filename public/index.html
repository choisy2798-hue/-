<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>복약 알리미</title>
<meta name="description" content="복약 순응도를 높이는 어르신 맞춤 복약 자가관리 앱">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1DB876">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="복약 알리미">
<meta name="application-name" content="복약 알리미">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2">
<style>
:root{
  --bg:#F4F6F8;
  --card:#FFFFFF;
  --text:#23272B;
  --text-sub:#8A9099;
  --text-faint:#B3B9C0;
  --primary:#1DB876;
  --primary-deep:#149A61;
  --primary-tint:#E6F8EF;
  --amber:#FFC94D;
  --amber-tint:#FFF7E4;
  --coral:#FF6F5E;
  --coral-tint:#FFEFEC;
  --line:#EEF1F3;
  --shadow:0 2px 10px rgba(20,30,40,0.06);
  --shadow-md:0 4px 16px rgba(20,30,40,0.08);
  --r-lg:24px;
  --r-md:18px;
  --r-sm:12px;
  --font-base:16px;
}
*{box-sizing:border-box;}
html{font-size:var(--font-base);}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
button, input{font-family:inherit;}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  background:var(--bg);
  overflow-x:hidden;
}

/* ---------- Tab views ---------- */
.tab-view{display:none;}
.tab-view.active{display:block; animation:fadeIn .3s ease;}
@keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@keyframes slideIn{ from{transform:translateX(100%);} to{transform:translateX(0);} }
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition:none !important;}
}
.tab-content{padding:0 18px calc(96px + env(safe-area-inset-bottom));}

/* ---------- Home header ---------- */
.home-topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 18px 8px;
}
.icon-btn{
  width:40px; height:40px;
  border:none; background:none;
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem;
  color:var(--text);
  cursor:pointer;
  position:relative;
  border-radius:50%;
}
.icon-btn:active{background:var(--line);}
.brand-word{font-size:1.05rem; font-weight:800; color:var(--text);}
.badge-dot{
  position:absolute; top:6px; right:6px;
  width:8px; height:8px; border-radius:50%;
  background:var(--coral);
  display:none;
}
.badge-dot.show{display:block;}

/* ---------- Simple root-tab header (복약체크/기록/건강정보/설정) ---------- */
.root-topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 18px 6px;
}
.root-title{font-size:1.25rem; font-weight:800;}

.greeting-block{padding:4px 18px 14px;}
.greeting-block .hello{font-size:1.02rem; color:var(--text-sub); margin:0 0 2px;}
.greeting-block .name-line{font-size:1.28rem; font-weight:800; margin:0 0 4px;}
.greeting-block .sub-line{font-size:0.92rem; color:var(--text-sub); margin:0;}

/* ---------- Generic card ---------- */
.card{
  background:var(--card);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:20px;
  margin:14px 0;
}
.card.pad-md{border-radius:var(--r-md); padding:16px;}
.card.pad-sm{border-radius:var(--r-sm); padding:14px;}
.card.tap{cursor:pointer;}
.card.tap:active{transform:scale(.99);}

.status-pill-card{
  display:flex; align-items:center; gap:10px;
  background:var(--card);
  border-radius:999px;
  box-shadow:var(--shadow);
  padding:14px 18px;
  margin:4px 0 14px;
  cursor:pointer;
  min-height:56px;
}
.status-pill-card .txt-wrap{flex:1; min-width:0;}
.status-pill-card .txt{display:block; font-size:0.98rem; font-weight:600;}
.status-pill-card .pill-caption{display:block; margin-top:3px; font-size:0.78rem; font-weight:600; color:var(--primary-deep);}
.status-pill-card .chev{color:var(--text-faint); font-size:1.1rem; flex-shrink:0;}

/* ---------- Arc progress (home / schedule) ---------- */
.arc-card-head{display:flex; justify-content:space-between; align-items:flex-start;}
.arc-card-title{font-size:0.92rem; color:var(--text-sub); margin:0 0 2px;}
.arc-card-num{font-size:1.55rem; font-weight:800; margin:0;}
.arc-card-num span{font-size:1rem; font-weight:600; color:var(--text-sub);}
.arc-card-sub{font-size:0.85rem; color:var(--text-sub); margin-top:2px;}
.arc-wrap{position:relative; margin-top:6px;}
.arc-svg{width:100%; display:block;}
.slot-chip-row{display:flex; gap:8px; margin-top:10px;}
.slot-chip{
  flex:1;
  border-radius:16px;
  background:#F6F7F9;
  padding:10px 4px 8px;
  text-align:center;
  position:relative;
  cursor:pointer;
  border:2px solid transparent;
}
.slot-chip .emoji{font-size:1.3rem; display:block;}
.slot-chip .label{font-size:0.78rem; color:var(--text-sub); margin-top:2px; font-weight:600;}
.slot-chip .time{font-size:0.7rem; color:var(--text-faint);}
.slot-chip.current{background:var(--primary-tint); border-color:var(--primary);}
.slot-chip.current .label{color:var(--primary-deep);}
.slot-chip.taken::after{
  content:"✓";
  position:absolute; top:2px; right:8px;
  color:var(--primary); font-weight:800; font-size:0.85rem;
}
.slot-chip.selected{border-color:var(--text);}

/* ---------- Encourage card ---------- */
.encourage-card{display:flex; align-items:center; gap:12px;}
.encourage-icon{
  width:42px; height:42px; border-radius:50%;
  background:var(--primary-tint);
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; flex-shrink:0;
}
.encourage-text b{display:block; font-size:0.96rem;}
.encourage-text span{font-size:0.85rem; color:var(--text-sub);}

/* ---------- Section header ---------- */
.section-head{display:flex; justify-content:space-between; align-items:center; margin:18px 4px 10px;}
.section-head h2{font-size:1.08rem; font-weight:800; margin:0;}
.section-head .more{font-size:0.85rem; color:var(--text-sub); cursor:pointer;}

/* ---------- Illustration banner card ---------- */
.illust{
  width:100%; height:120px;
  border-radius:var(--r-md);
  display:flex; align-items:center; justify-content:center;
  font-size:2.6rem;
  margin-bottom:0;
}
.illust-hero{height:150px; border-radius:var(--r-md) var(--r-md) 0 0; font-size:3.2rem;}
.tip-illust-card{padding:0; overflow:hidden;}
.tip-illust-body{padding:16px;}
.tip-illust-body b{display:block; font-size:1rem; margin-bottom:4px;}
.tip-illust-body span{font-size:0.85rem; color:var(--text-sub); line-height:1.4;}

/* ---------- Horizontal scroll stat row ---------- */
.hscroll{
  display:flex; gap:10px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
}
.hscroll::-webkit-scrollbar{display:none;}
.stat-mini{
  flex:0 0 auto;
  min-width:118px;
  background:var(--card);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:14px;
}
.stat-mini .emoji{font-size:1.4rem;}
.stat-mini b{display:block; font-size:1.15rem; margin-top:4px;}
.stat-mini span{font-size:0.76rem; color:var(--text-sub);}

/* ---------- Row-card (list card w/ image thumb) ---------- */
.row-card{
  display:flex; align-items:center; gap:12px;
  background:var(--card);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:12px;
  margin:10px 0;
  cursor:pointer;
}
.row-card:active{transform:scale(.99);}
.row-thumb{
  width:56px; height:56px; border-radius:14px;
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:1.5rem;
}
.row-main{flex:1; min-width:0;}
.row-main b{display:block; font-size:0.94rem;}
.row-main span{display:block; font-size:0.8rem; color:var(--text-sub); margin-top:2px; line-height:1.4;}

/* ---------- 2-col grid tip cards ---------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.tip-mini{
  background:var(--card);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:14px;
}
.tip-mini .emoji{font-size:1.5rem;}
.tip-mini b{display:block; font-size:0.9rem; margin-top:8px;}
.tip-mini span{display:block; font-size:0.78rem; color:var(--text-sub); margin-top:2px; line-height:1.4;}

/* ---------- Filter chips ---------- */
.chip-filter-row{display:flex; gap:8px; overflow-x:auto; padding:4px 0 4px; scrollbar-width:none;}
.chip-filter-row::-webkit-scrollbar{display:none;}
.chip-filter{
  flex:0 0 auto;
  border:1.5px solid var(--line);
  background:var(--card);
  color:var(--text-sub);
  border-radius:999px;
  padding:8px 16px;
  font-size:0.86rem;
  cursor:pointer;
  min-height:38px;
}
.chip-filter.active{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:700;}

/* ---------- Badge ---------- */
.badge-tag{
  display:inline-block;
  background:var(--amber-tint);
  color:#9C6E00;
  font-size:0.72rem;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  margin-bottom:6px;
}
.status-badge{
  font-size:0.76rem; font-weight:700;
  padding:4px 10px; border-radius:999px;
}
.status-badge.done{background:var(--primary-tint); color:var(--primary-deep);}
.status-badge.pending{background:#F1F3F5; color:var(--text-sub);}
.status-badge.warn{background:var(--coral-tint); color:#C4432F;}

/* ---------- Buttons ---------- */
.btn-primary{
  width:100%;
  min-height:54px;
  border:none;
  border-radius:var(--r-sm);
  background:var(--primary);
  color:#fff;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{background:#D9DDE1; color:#9AA1A8;}
.btn-outline{
  width:100%;
  min-height:48px;
  border:1.5px solid var(--line);
  border-radius:var(--r-sm);
  background:#fff;
  color:var(--text);
  font-size:0.95rem;
  font-weight:700;
  cursor:pointer;
}

/* ---------- Med list rows (check screen) ---------- */
.med-check-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.med-check-row:last-child{border-bottom:none;}
.med-check-icon{
  width:40px; height:40px; border-radius:12px;
  background:var(--primary-tint);
  display:flex; align-items:center; justify-content:center;
  font-size:1.15rem; flex-shrink:0;
}
.med-check-main{flex:1;}
.med-check-main b{font-size:0.94rem; display:block;}
.med-check-main span{font-size:0.78rem; color:var(--text-sub);}
.check-circle{
  width:26px; height:26px; border-radius:50%;
  border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-size:0.85rem; color:#fff; flex-shrink:0;
}
.check-circle.on{background:var(--primary); border-color:var(--primary);}

/* ---------- Progress bar ---------- */
.progress-track{
  height:9px; border-radius:999px; background:#EEF1F3; overflow:hidden; margin-top:10px;
}
.progress-fill{height:100%; background:var(--primary); border-radius:999px;}

/* ---------- Record: day strip ---------- */
.month-nav{display:flex; align-items:center; justify-content:space-between; margin:6px 4px 10px;}
.month-nav b{font-size:1.05rem;}
.month-nav button{
  width:36px; height:36px; border-radius:50%; border:none; background:#F1F3F5;
  font-size:1rem; cursor:pointer; color:var(--text);
}
.day-strip{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none;}
.day-strip::-webkit-scrollbar{display:none;}
.day-cell{
  flex:0 0 auto;
  width:48px;
  border-radius:14px;
  background:#F6F7F9;
  text-align:center;
  padding:8px 0;
  cursor:pointer;
  border:2px solid transparent;
}
.day-cell .dow{font-size:0.7rem; color:var(--text-sub);}
.day-cell .num{font-size:0.98rem; font-weight:700; margin-top:2px;}
.day-cell.selected{border-color:var(--text);}
.day-cell.full{background:var(--primary-tint);}
.day-cell.full .num{color:var(--primary-deep);}
.day-cell.partial{background:#EAF3FB;}
.day-cell.missed{background:var(--coral-tint);}
.day-cell.missed .num{color:#C4432F;}
.day-cell.upcoming{background:#F6F7F9; color:var(--text-faint);}

/* ---------- 월간 달력(진짜 격자형) ---------- */
.month-nav-today{
  border:1.5px solid var(--line); background:#fff; border-radius:999px;
  padding:6px 14px; font-size:0.82rem; color:var(--text-sub); cursor:pointer; min-height:36px;
}
.cal-dow-row{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin:4px 0 2px;}
.cal-dow-row span{font-size:0.78rem; color:var(--text-sub); padding:4px 0;}
.cal-dow-row span:first-child{color:#D9544A;}
.cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
  width:100%; box-sizing:border-box;
}
.cal-cell{
  aspect-ratio:1/1; min-width:0;
  border-radius:12px; background:#F6F7F9;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; border:2px solid transparent; position:relative;
  padding:2px;
}
.cal-cell.empty{background:transparent; cursor:default;}
.cal-cell .num{font-size:0.86rem; font-weight:700;}
.cal-cell .dots{display:flex; gap:2px; margin-top:2px; height:5px;}
.cal-cell .dots i{width:4px; height:4px; border-radius:50%; background:var(--primary); display:inline-block;}
.cal-cell.today{border-color:var(--sky-deep, #3E8FC4);}
.cal-cell.selected{border-color:var(--text);}
.cal-cell.full{background:var(--primary-tint);}
.cal-cell.full .num{color:var(--primary-deep);}
.cal-cell.partial{background:#EAF3FB;}
.cal-cell.missed{background:var(--coral-tint);}
.cal-cell.missed .num{color:#C4432F;}
.cal-cell.upcoming .num{color:var(--text-faint);}
@media (max-width:360px){
  .cal-cell .num{font-size:0.76rem;}
}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:0.78rem; color:var(--text-sub); margin:10px 2px 0;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}

.day-detail-title{font-size:1rem; font-weight:800; margin:6px 0 10px;}
.day-summary-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.day-summary-row:last-child{border-bottom:none;}
.day-summary-row .d{font-size:0.92rem; font-weight:700; min-width:92px;}
.day-summary-row .ratio{margin-left:auto; font-size:0.85rem; color:var(--text-sub); font-weight:700;}

/* ---------- Segment control ---------- */
.segment2{
  display:flex; background:#EEF1F3; border-radius:999px; padding:4px; margin:6px 0 4px;
}
.segment2 button{
  flex:1; border:none; background:none; min-height:42px; border-radius:999px;
  font-size:0.92rem; color:var(--text-sub); cursor:pointer;
}
.segment2 button.active{background:#fff; color:var(--text); font-weight:800; box-shadow:var(--shadow);}

/* ---------- Bottom nav (5 tabs) ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0;
  max-width:480px; margin:0 auto;
  background:#FFFFFF;
  border-top:1px solid var(--line);
  display:flex;
  padding:6px 2px calc(6px + env(safe-area-inset-bottom));
  z-index:50;
}
.nav-btn{
  flex:1; background:none; border:none; min-height:56px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--text-faint); font-size:0.7rem; cursor:pointer;
}
.nav-btn .icon{font-size:1.35rem;}
.nav-btn.active{color:var(--primary); font-weight:800;}

/* ---------- Detail overlay (pushed screens) ---------- */
.detail-overlay{
  position:fixed; inset:0;
  max-width:480px; margin:0 auto;
  background:var(--bg);
  z-index:100;
  display:none;
  overflow-y:auto;
}
.detail-overlay.show{display:block; animation:slideIn .28s ease;}
.detail-topbar{
  display:flex; align-items:center; gap:8px;
  padding:calc(16px + env(safe-area-inset-top)) 10px 10px 4px;
  background:var(--bg);
  position:sticky; top:0;
}
.detail-topbar .back-btn{
  width:40px; height:40px; border:none; background:none; font-size:1.3rem; cursor:pointer; color:var(--text);
  border-radius:50%;
}
.detail-topbar .back-btn:active{background:var(--line);}
.detail-topbar .t{font-size:1.12rem; font-weight:800;}
.detail-body{padding:4px 18px 60px;}

/* ---------- Menu list rows (mypage) ---------- */
.menu-row{
  display:flex; align-items:center; gap:14px;
  background:var(--card);
  padding:16px 16px;
  cursor:pointer;
}
.menu-row:first-child{border-radius:var(--r-md) var(--r-md) 0 0;}
.menu-row:last-child{border-radius:0 0 var(--r-md) var(--r-md);}
.menu-row + .menu-row{border-top:1px solid var(--line);}
.menu-row .mi{font-size:1.15rem; width:24px; text-align:center;}
.menu-row .mt{flex:1; font-size:0.96rem; font-weight:600;}
.menu-row .chev{color:var(--text-faint);}
.menu-group{background:var(--card); border-radius:var(--r-md); box-shadow:var(--shadow); overflow:hidden; margin:14px 0;}

.profile-card{display:flex; align-items:center; gap:14px;}
.profile-avatar{
  width:56px; height:56px; border-radius:50%;
  background:var(--primary-tint);
  display:flex; align-items:center; justify-content:center;
  font-size:1.7rem; flex-shrink:0;
}
.profile-main{flex:1;}
.profile-main b{font-size:1.05rem; display:block;}
.profile-main .link{font-size:0.82rem; color:var(--text-sub); margin-top:2px;}

/* ---------- Forms (detail screens) ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.86rem; color:var(--text-sub); margin-bottom:6px; font-weight:600;}
.field input[type="text"], .field input[type="date"], .field input[type="number"], .field input[type="time"]{
  width:100%; min-height:48px;
  border:1.5px solid var(--line); border-radius:var(--r-sm);
  padding:0 14px; font-size:0.98rem; color:var(--text); background:#fff;
}
.toggle-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; min-height:56px;
}
.toggle-row span{font-size:0.94rem; font-weight:600;}
.switch{position:relative; width:48px; height:28px; flex-shrink:0;}
.switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; z-index:2; cursor:pointer;}
.switch .track{position:absolute; inset:0; background:#DDE2E6; border-radius:999px; transition:background .2s;}
.switch .thumb{position:absolute; top:3px; left:3px; width:22px; height:22px; background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s;}
.switch input:checked + .track{background:var(--primary);}
.switch input:checked + .track + .thumb{transform:translateX(20px);}

.tag-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
.tag-check{
  border:1.5px solid var(--line); border-radius:999px; padding:8px 14px;
  font-size:0.86rem; cursor:pointer; min-height:40px; display:flex; align-items:center; color:var(--text-sub);
}
.tag-check.checked{background:var(--primary-tint); border-color:var(--primary); color:var(--primary-deep); font-weight:700;}
.tag-check input{display:none;}

.med-manage-row{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
.med-manage-row:last-of-type{border-bottom:none;}
.med-manage-main{flex:1 1 0; min-width:0; word-break:keep-all; overflow-wrap:anywhere;}
.med-manage-row .btn-outline{width:auto; flex:0 0 auto; white-space:nowrap; padding:0 16px; min-height:44px;}
.med-manage-row .remove-btn{flex:0 0 auto;}
.med-manage-main b{font-size:0.94rem; display:block;}
.med-manage-main span{font-size:0.78rem; color:var(--text-sub); display:block; margin-top:2px; line-height:1.4;}
.med-manage-main .remain{font-size:0.8rem; font-weight:700; margin-top:2px;}
.med-manage-main .remain.warn{color:var(--coral);}
.remove-btn{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--coral-tint); color:var(--coral);
  font-size:1rem; cursor:pointer; flex-shrink:0;
}

.font-seg{display:flex; gap:8px; margin-top:6px;}
.font-seg button{
  flex:1; min-height:46px; border-radius:var(--r-sm); border:1.5px solid var(--line); background:#fff;
  color:var(--text); font-size:0.9rem; cursor:pointer;
}
.font-seg button.active{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:800;}

.hint-text{color:var(--text-sub); font-size:0.85rem; line-height:1.5; margin-top:8px;}

/* ---------- Side drawer (hamburger) ---------- */
.drawer-backdrop{
  position:fixed; inset:0; background:rgba(20,25,30,0.35);
  z-index:150; display:none;
}
.drawer-backdrop.show{display:block; animation:fadeIn .2s ease;}
.drawer{
  position:fixed; top:0; left:0; bottom:0; width:76%; max-width:320px;
  background:#fff; z-index:151;
  padding:calc(24px + env(safe-area-inset-top)) 20px 20px;
  transform:translateX(-100%);
  transition:transform .25s ease;
}
.drawer.show{transform:translateX(0);}
.drawer .dh{font-size:1.1rem; font-weight:800; margin-bottom:18px;}
.drawer .dlink{
  display:flex; align-items:center; gap:12px;
  padding:14px 4px; font-size:0.98rem; font-weight:600; cursor:pointer;
  border-radius:12px;
}
.drawer .dlink:active{background:var(--line);}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);
  background:#23272B; color:#fff; padding:12px 20px; border-radius:999px;
  font-size:0.9rem; max-width:88%; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:999;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Notification overlay list ---------- */
.notif-row{padding:14px 0; border-bottom:1px solid var(--line);}
.notif-row:last-child{border-bottom:none;}
.notif-row b{font-size:0.92rem; display:block;}
.notif-row span{font-size:0.78rem; color:var(--text-sub);}

.foot-space{height:10px;}

/* ---------- v8: 어르신 사용성 개선 ---------- */
.home-big-btn{
  display:block; width:100%; min-height:64px; margin:12px 0 0;
  border:none; border-radius:var(--r-sm); background:var(--primary); color:#fff;
  font-size:1.1rem; font-weight:800; cursor:pointer; padding:12px 14px; line-height:1.35;
}
.home-big-btn:active{transform:scale(.98);}
.home-big-btn.soft{background:var(--primary-tint); color:var(--primary-deep); border:1.5px solid var(--primary);}
.home-big-btn.side{background:#fff; color:#C4432F; border:1.5px solid var(--coral);}
.home-recent-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); font-size:1rem;}
.home-recent-row b{font-weight:800;}
.home-recent-row span{color:var(--text-sub); font-weight:700;}
.symptom-grid{display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 14px;}
.symptom-chip{min-height:56px; padding:0 18px; border-radius:28px; border:1.5px solid var(--line); background:#fff; font-size:1.05rem; font-weight:700; cursor:pointer; color:var(--text);}
.symptom-chip.on{background:var(--coral-tint); border-color:var(--coral); color:#C4432F;}
.se-row{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
.se-row:last-child{border-bottom:none;}
.se-row .se-main{flex:1; min-width:0;}
.se-row .se-main b{display:block; font-size:1rem;}
.se-row .se-main span{font-size:0.88rem; color:var(--text-sub); word-break:break-word;}
.se-del{min-height:44px; min-width:56px; border:1.5px solid var(--line); border-radius:var(--r-sm); background:#fff; color:#C4432F; font-weight:700; font-size:0.95rem; cursor:pointer;}
.manual-card{background:#fff; border-radius:var(--r-md,16px); padding:20px 18px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); border:1px solid var(--line);}
.manual-card .mn{display:inline-block; font-size:0.8rem; font-weight:800; color:var(--primary-deep); background:var(--primary-tint); border-radius:12px; padding:2px 10px;}
.manual-card .mi{display:block; font-size:2.4rem; margin:8px 0 4px;}
.manual-card h3{margin:0 0 6px; font-size:1.2rem; font-weight:800;}
.manual-card p{margin:0; font-size:1rem; line-height:1.55; color:var(--text-sub);}
.firstrun-sheet{position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:20px;}
.firstrun-sheet.show{display:flex;}
.firstrun-box{background:#fff; border-radius:20px; padding:24px 20px; width:100%; max-width:380px; text-align:center;}
.firstrun-box h3{margin:0 0 8px; font-size:1.25rem;}
.firstrun-box p{margin:0 0 18px; font-size:1rem; color:var(--text-sub); line-height:1.5;}
.firstrun-box button{margin-top:8px;}

/* ---------- v8: 식물 키우기 / 놓친 이유 ---------- */
.reason-opt{display:block; width:100%; text-align:left; min-height:56px; padding:12px 16px; margin:8px 0; border-radius:14px; border:1.5px solid var(--line); background:#fff; font-size:1.05rem; font-weight:700; cursor:pointer; color:var(--text);}
.reason-opt{display:flex; align-items:center; gap:12px; min-height:64px; font-size:1.1rem; line-height:1.4;}
.reason-opt.on{border-color:var(--primary); background:var(--primary-tint); color:var(--primary-deep);}
.reason-box{flex:0 0 32px; width:32px; height:32px; border-radius:9px; border:2.5px solid #9AA5AD; background:#fff; display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:900; color:#fff;}
.reason-opt.on .reason-box{background:var(--primary); border-color:var(--primary);}
.reason-txt{flex:1; min-width:0; overflow-wrap:anywhere;}
/* ---- 7일 화분 키우기 ---- */
.plant-card{
  background:#F2FBF6; border:2px solid #CDEFDD; border-radius:20px;
  padding:18px 16px 20px; max-width:420px; margin:0 auto;
  font-family:inherit; color:#1F3A2E; text-align:center;
}
.plant-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px}
.plant-title{font-size:20px; font-weight:800}
.plant-flowers{font-size:17px; font-weight:700; color:#C2456B}
.plant-svg{width:100%; max-width:260px; height:auto; display:block; margin:0 auto}
.p-part{transform-box:fill-box; transform-origin:50% 100%;
  transition:transform .8s cubic-bezier(.34,1.56,.64,1), opacity .5s}
.p-part.p-off{transform:scale(0); opacity:0}
.plant-dots{display:flex; justify-content:center; gap:8px; margin:6px 0 12px}
.plant-dot{width:34px; height:34px; border-radius:50%; border:2px solid #CDEFDD; background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:#9BB8A9}
.plant-dot.on{background:#1DB876; border-color:#1DB876; color:#fff}
.plant-dot.today{box-shadow:0 0 0 3px #FFD166}
.plant-msg{font-size:21px; font-weight:800; line-height:1.4; margin:0 0 4px; word-break:keep-all}
.plant-sub{font-size:17px; color:#4D6B5C; line-height:1.4; margin:0; word-break:keep-all}
.plant-card.bloom .plant-svg{animation:plantJoy 1s ease 1}
@keyframes plantJoy{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.p-part{transition:none}.plant-card.bloom .plant-svg{animation:none}}
</style>
</head>
<body>

      <div style="margin-top:14px;"><div class="plant-card" id="plantCard">
